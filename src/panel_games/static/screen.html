<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Games Screen</title>
<style>
  html, body { margin:0; height:100%; background:#000; color:#8b929c; font:14px system-ui, sans-serif; overflow:hidden; }
  #wrap { display:flex; align-items:center; justify-content:center; height:100%; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; max-width:100vw; max-height:100vh; }
  #info { position:fixed; left:8px; bottom:6px; opacity:0.7; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="768" height="128"></canvas></div>
<div id="info"></div>
<script>
// Polls the latest frame as PNG (204 when unchanged) and draws it pixel-scaled to fill the window.
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let since = '';
function fitCanvas() {
  const s = Math.max(1, Math.min(innerWidth / cv.width, innerHeight / cv.height));
  cv.style.width = Math.floor(cv.width * s) + 'px';
  cv.style.height = Math.floor(cv.height * s) + 'px';
}
addEventListener('resize', fitCanvas);
async function poll() {
  try {
    const r = await fetch('/api/screen.png?since=' + since, { cache: 'no-store' });
    if (r.status === 200) {
      since = r.headers.get('X-Frame') || '';
      const img = await createImageBitmap(await r.blob());
      if (img.width !== cv.width || img.height !== cv.height) { cv.width = img.width; cv.height = img.height; fitCanvas(); }
      ctx.drawImage(img, 0, 0);
    }
  } catch (e) { /* server restarting: keep trying */ }
  setTimeout(poll, 16);
}
async function info() {
  try {
    const s = await (await fetch('/api/status')).json();
    const url = (s.urls && s.urls[0]) || location.origin + '/';
    document.getElementById('info').textContent = s.game ? '' : 'Join on your phone: ' + url;
  } catch (e) {}
  setTimeout(info, 3000);
}
fitCanvas(); poll(); info();
</script>
</body>
</html>
